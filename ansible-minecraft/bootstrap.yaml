
---
- name: Bootstrap Minecraft Server
  hosts: minecraft
  become: true

  tasks:
    - name: Ensure sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present

    - name: Create deployment user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        state: present

    - name: Create SSH directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Install SSH public key
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub') | trim }}\n"
        dest: /home/deploy/.ssh/authorized_keys
        owner: deploy
        group: deploy
        mode: "0600"

    - name: Configure sudo for automation
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-deploy
        content: "deploy ALL=(ALL) ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Ensure deploy user has sudo privileges
      ansible.builtin.user:
        name: deploy
        groups: sudo
        append: true

    - name: Allow passwordless sudo for deploy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-minecraft-deploy
        content: "deploy ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
