
---
- name: Install and configure Fail2ban
  hosts: minecraft
  become: true

  tasks:
    - name: Install Fail2ban
      ansible.builtin.apt:
        name:
          - fail2ban
          - python3-systemd
        state: present
        update_cache: true

    - name: Configure SSH protection
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/minecraft-sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = 2222
          backend = systemd
          banaction = ufw
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Restart Fail2ban

    - name: Validate Fail2ban configuration
      ansible.builtin.command:
        cmd: fail2ban-client -t
      changed_when: false

    - name: Enable and start Fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Apply configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Verify SSH jail
      ansible.builtin.command:
        cmd: fail2ban-client status sshd
      changed_when: false

  handlers:
    - name: Restart Fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
