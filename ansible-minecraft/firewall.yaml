---
- name: UFW Firewall konfigurieren
  hosts: minecraft
  become: true

  tasks:
    - name: UFW installieren
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: SSH auf Port 2222 erlauben
      community.general.ufw:
        rule: allow
        port: "2222"
        proto: tcp

    - name: Alte SSH-Freigabe entfernen
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        delete: true

    - name: Eingehende Verbindungen blockieren
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Ausgehende Verbindungen erlauben
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: UFW aktivieren
      community.general.ufw:
        state: enabled

    - name: SSH-Verbindung prüfen
      ansible.builtin.wait_for_connection:
        timeout: 30