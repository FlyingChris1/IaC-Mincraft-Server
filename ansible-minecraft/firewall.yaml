
---
- name: UFW Firewall konfigurieren
  hosts: minecraft
  become: true

  tasks:
    - name: UFW installieren
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: SSH erlauben
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Eingehende Verbindungen blockieren
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Ausgehende Verbindungen erlauben
      community.general.ufw:
        default: allow
        direction: outgoing

    - name: UFW aktivieren
      community.general.ufw:
        state: enabled
