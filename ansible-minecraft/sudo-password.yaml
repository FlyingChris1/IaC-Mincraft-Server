---
- name: Passwortgeschütztes Sudo konfigurieren
  hosts: minecraft
  become: true

  vars_files:
    - vars/deploy-vault.yaml

  tasks:
    - name: Deploy Benutzer in Sudo-Gruppe sicherstellen
      ansible.builtin.user:
        name: deploy
        groups: sudo
        append: true

    - name: Passwort für Deploy setzen
      ansible.builtin.user:
        name: deploy
        password: "{{ deploy_password_hash }}"
        update_password: always
      no_log: true

    - name: Passwortloses Sudo entfernen
      ansible.builtin.file:
        path: /etc/sudoers.d/99-minecraft-deploy
        state: absent