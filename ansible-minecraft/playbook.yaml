
---
- name: Minecraft Server Setup
  hosts: minecraft
  become: true

  vars:
    minecraft_data_dir: /opt/minecraft/data
    minecraft_memory: "2G"
    minecraft_port: 25565

  tasks:
    - name: Docker installieren
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Docker starten
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Minecraft Verzeichnis erstellen
      ansible.builtin.file:
        path: "{{ minecraft_data_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"


    
    - name: Minecraft Docker Container starten
      community.docker.docker_container:
        name: minecraft
        image: "itzg/minecraft-server@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776"
        state: started
        pull: missing
        recreate: false
        restart: false
        restart_policy: unless-stopped

        privileged: false
        security_opts:
          - "no-new-privileges:true"
        cap_drop:
          - NET_RAW

        memory: "3G"
        cpus: 1.5
        pids_limit: 512

        init: true
        stop_timeout: 120

        published_ports:
          - "127.0.0.1:25565:25565"
        publish_all_ports: false

        volumes:
          - "{{ minecraft_data_dir }}:/data"

        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"

        env:
          EULA: "TRUE"
          TYPE: "VANILLA"
          VERSION: "26.3"
          MEMORY: "{{ minecraft_memory }}"
          UID: "1000"
          GID: "1000"
          ONLINE_MODE: "TRUE"
          ENABLE_RCON: "false"

