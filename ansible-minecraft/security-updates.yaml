
---
- name: Configure Automatic Security Updates
  hosts: minecraft
  become: true

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable automatic daily updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Disable automatic system reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52minecraft-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable automatic update timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Apply available Ubuntu package updates
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
        cache_valid_time: 3600